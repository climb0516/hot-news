<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>HotPulse · 全网热榜</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09080a;
      --panel: rgba(24,21,24,0.72);
      --panel-solid: #151215;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.13);
      --text-1: #efedef;
      --text-2: #a8a2a8;
      --text-3: #6d666d;
      --accent: #ff5a3c;
      --accent-2: #ffb02e;
      --grad: linear-gradient(120deg, #ff3d5a 0%, #ff8a2b 60%, #ffc23d 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(255,80,60,0.16);
      --glow-2: rgba(255,170,40,0.08);
      --rank-1: #ff3b4e;
      --rank-2: #ff7a2f;
      --rank-3: #ffb020;
      --cat-politics: #f87171;
      --cat-world: #60a5fa;
      --cat-sports: #34d399;
      --cat-ent: #f472b6;
      --cat-finance: #fbbf24;
      --cat-tech: #a78bfa;
      --cat-society: #94a3b8;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #faf9f8;
      --panel: rgba(255,255,255,0.85);
      --panel-solid: #ffffff;
      --hover: rgba(30,10,10,0.035);
      --line: rgba(30,10,10,0.08);
      --line-2: rgba(30,10,10,0.15);
      --text-1: #1a1416;
      --text-2: #5e5458;
      --text-3: #978c90;
      --accent: #e8402a;
      --accent-2: #d98400;
      --grid-dot: rgba(30,10,10,0.06);
      --glow-1: rgba(255,80,60,0.09);
      --glow-2: rgba(255,170,40,0.06);
      --cat-politics: #dc2626;
      --cat-world: #2563eb;
      --cat-sports: #059669;
      --cat-ent: #db2777;
      --cat-finance: #b45309;
      --cat-tech: #7c3aed;
      --cat-society: #64748b;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(60,20,20,0.07);
      --kbd-bg: rgba(30,10,10,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; gap: 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--grad);
      display: grid; place-items: center;
      font-size: 15px;
      box-shadow: 0 0 20px var(--glow-1);
    }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input {
      flex: 1; min-width: 0; background: none; border: none; outline: none;
      color: var(--text-1); font: inherit; font-size: 13.5px;
    }
    .search input::placeholder { color: var(--text-3); }
    kbd {
      font-family: inherit; font-size: 11px; color: var(--text-3);
      background: var(--kbd-bg); border: 1px solid var(--line);
      border-radius: 5px; padding: 1px 6px;
    }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--panel); border: 1px solid var(--line);
      cursor: pointer; display: grid; place-items: center; color: var(--text-2);
    }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout {
      max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px;
      display: grid; grid-template-columns: 210px minmax(0, 1fr) 300px; gap: 24px;
      align-items: start;
    }
    .side { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; display: flex; justify-content: space-between; }
    .side-title button { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 11.5px; }
    .side-title button:hover { color: var(--accent); }
    .side-group + .side-group { margin-top: 22px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px; border: none; background: none;
      cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px;
      position: relative;
    }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }
    .nav-item.off { opacity: .4; }
    .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .avatar {
      width: 20px; height: 20px; border-radius: 6px; flex: none;
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 10px; letter-spacing: -0.03em;
    }
    .avatar.xs { font-size: 7.5px; letter-spacing: -0.06em; }
    .avatar.lg { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }
    .fail-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }

    /* ── Main header ── */
    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }

    /* ── Board view ── */
    .boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
    .board { display: flex; flex-direction: column; overflow: hidden; }
    .board-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    .board-head b { font-size: 14.5px; }
    .board-head .meta { margin-left: auto; font-size: 11.5px; color: var(--text-3); text-align: right; }
    .board-head .stale { color: #f59e0b; }
    .board-list { list-style: none; padding: 6px 6px; }
    .row {
      display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 8px;
    }
    .row:hover { background: var(--hover); }
    .rank { width: 20px; flex: none; text-align: center; font-weight: 700; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
    .rank.r1 { color: var(--rank-1); } .rank.r2 { color: var(--rank-2); } .rank.r3 { color: var(--rank-3); }
    .row-title { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; color: var(--text-1); }
    .row-title:hover { color: var(--accent); }
    .row-hot { flex: none; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 2px; }
    .label {
      display: inline-block; font-size: 10.5px; line-height: 16px; padding: 0 4px; border-radius: 4px;
      margin-left: 6px; color: #fff; vertical-align: 1px; font-weight: 600;
    }
    .label.l-新 { background: #ff3852; } .label.l-热 { background: #ff8a2b; } .label.l-沸 { background: #f4233c; }
    .label.l-爆 { background: #bd0000; } .label.l-辟谣 { background: #6b7280; } .label.l-default { background: #8b5cf6; }
    .board-more { margin: 2px 12px 12px; padding: 7px; border-radius: 8px; border: 1px dashed var(--line-2); background: none; color: var(--text-3); cursor: pointer; font-size: 12.5px; }
    .board-more:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Event & feed list ── */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .post { padding: 16px 18px; display: flex; gap: 16px; transition: border-color .15s, transform .15s; }
    .post:hover { border-color: var(--line-2); }
    .post-body { flex: 1; min-width: 0; }
    .post-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; margin-bottom: 6px; }
    .post-meta b { color: var(--text-2); font-weight: 600; }
    .post h3 { font-size: 15.5px; font-weight: 650; line-height: 1.5; letter-spacing: -0.005em; }
    .post h3 a:hover { color: var(--accent); }
    .post .summary { font-size: 13px; color: var(--text-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .thumb { width: 132px; height: 88px; border-radius: 10px; object-fit: cover; flex: none; background: var(--hover); border: 1px solid var(--line); }
    .cat-tag { font-size: 11px; padding: 0 7px; line-height: 18px; border-radius: 999px; border: 1px solid currentColor; font-weight: 600; }
    .heat-badge { font-size: 11px; font-weight: 700; color: #fff; padding: 0 7px; line-height: 18px; border-radius: 999px; background: var(--grad); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2);
      padding: 3px 8px 3px 4px; border-radius: 999px; background: var(--hover); border: 1px solid var(--line);
    }
    .chip:hover { border-color: var(--line-2); color: var(--text-1); }
    .chip .avatar { width: 16px; height: 16px; border-radius: 50%; font-size: 8.5px; }
    .chip em { font-style: normal; color: var(--accent); font-weight: 700; }
    .event-rank { font-size: 26px; font-weight: 800; width: 36px; flex: none; color: var(--text-3); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .event-rank.top { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .load-more { display: block; margin: 18px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; color: var(--text-2); }
    .load-more:hover { color: var(--text-1); border-color: var(--accent); }
    .empty { text-align: center; padding: 60px 0; color: var(--text-3); }

    /* ── Right widgets ── */
    .widget { padding: 14px 16px 12px; }
    .widget + .widget { margin-top: 16px; }
    .widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .widget-head b { font-size: 14px; }
    .widget-head small { font-size: 11.5px; color: var(--text-3); }
    .w-row { display: flex; gap: 10px; padding: 6px 0; font-size: 13px; align-items: flex-start; }
    .w-row .rank { width: 16px; }
    .w-row a { flex: 1; min-width: 0; color: var(--text-1); line-height: 1.45; }
    .w-row a:hover { color: var(--accent); }
    .w-row small { color: var(--text-3); font-size: 11px; white-space: nowrap; padding-top: 2px; }
    .bar-row { display: grid; grid-template-columns: 64px 1fr 34px; gap: 10px; align-items: center; font-size: 12px; color: var(--text-2); padding: 4px 0; }
    .bar { height: 6px; background: var(--hover); border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 3px; }
    .bar-row span:last-child { text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .status-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--text-2); }
    .status-row .t { margin-left: auto; color: var(--text-3); font-size: 11.5px; }
    .ok { color: #22c55e; } .bad { color: #ef4444; } .warn { color: #f59e0b; }

    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }

    /* ── Responsive ── */
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 190px minmax(0, 1fr); }
      /* 右栏挪到正文下面，挂件横排 */
      .right { grid-column: 1 / -1; position: static; max-height: none; overflow: visible;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
      .right .widget + .widget { margin-top: 0; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 0 14px; gap: 10px; }
      .logo small, .updated span, kbd { display: none; }
      .search { min-width: 0; } .search input { min-width: 0; width: 100%; }          /* 搜索框可缩，右侧按钮不被挤出屏幕 */
      .layout { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 48px; gap: 14px; }
      .side { position: static; max-height: none; overflow: visible; min-width: 0; }
      #reload { display: none; }
      .side-group + .side-group { margin-top: 10px; }
      .side-title { display: none; }
      .nav-list { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); padding: 5px 10px; }
      .nav-item.active::before { display: none; }
      .nav-item .count { display: none; }
      .boards { grid-template-columns: 1fr; }
      .thumb { width: 92px; height: 68px; }
      .thumb.ph { font-size: 22px; }
      .row .mini-thumb { display: none; }
      .post { padding: 14px; gap: 12px; }
      .event-rank { display: none; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
    /* 可点开详情的元素 */
    a.row { color: inherit; }
    a.row:hover .row-title { color: var(--accent); }
    .post[data-kit-item] { cursor: pointer; }
    .post[data-kit-item]:hover h3 { color: var(--accent); }
    .thumb.ph { display: grid; place-items: center; font-size: 30px; }
    a.board-more { display: block; text-align: center; }
    .widget-head .kit-morelink { font-size: 12px; background: none; border: 0; }
    .row-sum { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .mini-thumb { width: 64px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--hover); }
    .kit-row .avatar { flex: none; }
    .kit-row .kit-rt b { font-weight: 700; }
  </style>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    if (!d) { close(true); return false; }
    render(d);
    return true;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('hp.' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('hp.' + k, JSON.stringify(v)); } catch {} },   // 无痕模式等写不进去时忽略
};

const PAGE = 40;
const BOARD_TOP = 10;
const state = {
  data: null,
  view: ['boards', 'events', 'feed'].includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('view', 'boards'),
  cat: 'all',
  hidden: new Set(store.get('hidden', [])),   // 被取消勾选的平台 id
  q: '',
  page: 1,
};

// ── 主题 ──
const applyTheme = t => document.documentElement.dataset.theme = t;
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

// ── 工具 ──
const srcMap = () => Object.fromEntries(state.data.sources.map(s => [s.id, s]));
const catName = id => (state.data.categories.find(c => c.id === id) || {}).name || '社会';
const catColor = id => `var(--cat-${id})`;
const CAT_ICON = { politics: '🏛', world: '🌍', sports: '⚽', ent: '🎬', finance: '💹', tech: '💡', society: '🏙' };
const catBg = id => `color-mix(in srgb, var(--cat-${id}) 18%, transparent)`;
const avatar = (s, cls = '') => `<span class="avatar ${cls} ${s.abbr.length > 2 && cls !== 'lg' ? 'xs' : ''}" style="background:${s.color}">${esc(s.abbr)}</span>`;
const labelHtml = l => l ? `<span class="label l-${['新','热','沸','爆','辟谣'].includes(l) ? l : 'default'}">${esc(l)}</span>` : '';
// 图片加载失败：换成同尺寸的分类图标占位，避免卡片高低不齐
const img = (src, cat, cls = 'thumb') => src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" data-cat="${cat || 'society'}" onerror="imgFail(this)">` : '';
function imgFail(el) {
  const c = el.dataset.cat, ph = document.createElement('span');
  ph.className = el.className + ' ph';
  ph.style.background = catBg(c);
  ph.textContent = CAT_ICON[c] || '📰';
  el.replaceWith(ph);
}
const short = s => s.name.replace(/(热搜|热榜|热门|新闻)$/, '');   // 「去微博 ↗」按钮用的平台简称

function timeAgo(iso) {
  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  if (m < 1440) return `${Math.round(m / 60)} 小时前`;
  return `${Math.round(m / 1440)} 天前`;
}

function matchQ(...texts) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return texts.some(t => (t || '').toLowerCase().includes(q));
}

// 当前筛选条件下某平台可见的条目
function visibleItems(s) {
  if (state.hidden.has(s.id)) return [];
  return s.items.filter(it => (state.cat === 'all' || it.category === state.cat) && matchQ(it.title, it.summary, s.name));
}

// ── 索引：详情地址 #/item/hot/<平台id>/<条目id>、#/item/event/<事件id>（id 由 scraper 按标题 md5 生成） ──
let IDX = { item: new Map(), event: new Map(), byTitle: new Map() };
function buildIndex() {
  const { sources, events } = state.data;
  IDX = { item: new Map(), event: new Map(), byTitle: new Map() };
  sources.forEach(s => s.items.forEach(it => {
    it.id = it.id || 'r' + it.rank;                       // 旧数据没有 id 时退回排名
    const k = `${s.id}/${it.id}`;
    if (!IDX.item.has(k)) IDX.item.set(k, { s, it });
  }));
  events.forEach((e, i) => {
    e.id = e.id || 'e' + i;
    IDX.event.set(e.id, e);
    e.platforms.forEach(p => IDX.byTitle.set(`${p.source}/${p.title}`, e));
  });
}
const findItem = (sid, title) => { const s = srcMap()[sid]; return s && s.items.find(it => it.title === title); };
const itemKey = (s, it) => `hot/${s.id}/${it.id}`;
const kitAttr = key => `href="#/item/${key}" data-kit-item="${key}"`;

// 标题相似度（与 scraper 的事件合并同一算法），给不在事件里的条目找其它平台的同题条目
const norm = t => t.toLowerCase().replace(/[#【】\[\]「」『』“”"'‘’《》（）()：:，,。.！!？?、\s·|_\-—…]/g, '');
const bigrams = s => s.length > 1 ? new Set([...Array(s.length - 1)].map((_, i) => s.slice(i, i + 2))) : new Set([s]);
function similar(a, b) {
  if (!a || !b) return false;
  if (a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return true;
  const ga = bigrams(a), gb = bigrams(b);
  let inter = 0; ga.forEach(g => gb.has(g) && inter++);
  const ratio = inter / Math.min(ga.size, gb.size);
  return (inter >= 3 && ratio >= 0.6) || (inter >= 5 && ratio >= 0.4);
}
// 同一件事在各平台的条目：[{ s, it }]，按排名升序
function samePlatforms(s, it) {
  const e = IDX.byTitle.get(`${s.id}/${it.title}`);
  if (e && e.platforms.length > 1) {
    const S = srcMap();
    return { e, list: e.platforms.map(p => ({ s: S[p.source], it: findItem(p.source, p.title), p })).filter(x => x.s) };
  }
  const n = norm(it.title), list = [{ s, it }];
  if (s.region !== 'cn') return { e: null, list };          // 英文标题按字母二元组比相似度会误配，海外只看自身
  state.data.sources.forEach(o => {
    if (o.id === s.id || o.region !== s.region) return;
    const hit = o.items.find(x => similar(n, norm(x.title)));
    if (hit) list.push({ s: o, it: hit });
  });
  return { e: null, list: list.sort((a, b) => a.it.rank - b.it.rank) };
}

// ── 左侧导航 ──
function renderNav() {
  const { sources, categories } = state.data;
  const shown = sources.filter(s => !state.hidden.has(s.id));
  const catCount = { all: 0 };
  shown.forEach(s => s.items.forEach(it => {
    if (!matchQ(it.title, it.summary, s.name)) return;
    catCount.all++; catCount[it.category] = (catCount[it.category] || 0) + 1;
  }));
  $('#cats').innerHTML = [{ id: 'all', name: '全部' }, ...categories].map(c => `
    <button class="nav-item ${state.cat === c.id ? 'active' : ''}" data-cat="${c.id}">
      <i class="dot" style="background:${c.id === 'all' ? 'var(--accent)' : catColor(c.id)}"></i>${c.name}
      <span class="count">${catCount[c.id] || 0}</span>
    </button>`).join('');

  for (const region of ['cn', 'intl']) {
    $('#src-' + region).innerHTML = sources.filter(s => s.region === region).map(s => {
      const n = s.items.filter(it => (state.cat === 'all' || it.category === state.cat) && matchQ(it.title, it.summary, s.name)).length;
      return `<button class="nav-item ${state.hidden.has(s.id) ? 'off' : ''}" data-src="${s.id}" title="${s.ok ? '' : esc(s.error)}">
        ${avatar(s)}${esc(s.name)}${s.ok ? '' : '<i class="fail-dot"></i>'}<span class="count">${n}</span>
      </button>`;
    }).join('');
  }
}

// 榜单行（首页卡片与列表页共用）
const rowHtml = (s, it, rich) => `
  <li><a class="row" ${kitAttr(itemKey(s, it))} title="${esc(it.summary || it.title)}">
    <span class="rank ${it.rank <= 3 ? 'r' + it.rank : ''}">${it.rank}</span>
    <span class="row-title">${esc(it.title)}${labelHtml(it.label)}${rich && it.summary && it.summary !== it.title ? `<span class="row-sum">${esc(it.summary)}</span>` : ''}</span>
    ${rich ? img(it.image, it.category, 'mini-thumb') : ''}
    <span class="row-hot">${esc(it.hot_text)}</span>
  </a></li>`;

// ── 视图：平台榜单 ──
function renderBoards() {
  const cards = state.data.sources.filter(s => !state.hidden.has(s.id)).map(s => {
    const items = visibleItems(s);
    if (!items.length && (state.q || state.cat !== 'all')) return '';
    const status = s.stale ? `<span class="stale">本次抓取失败 · 显示旧数据</span>` : timeAgo(s.updated) + '更新';
    return `<section class="card board">
      <div class="board-head">${avatar(s, 'lg')}<div><b>${esc(s.name)}</b></div>
        <div class="meta">${items.length} 条<br>${status}</div></div>
      <ol class="board-list">${items.slice(0, BOARD_TOP).map(it => rowHtml(s, it)).join('') || '<li class="row"><span class="row-title" style="color:var(--text-3)">暂无数据</span></li>'}</ol>
      ${items.length > BOARD_TOP ? `<a class="board-more" href="#/list/${s.id}${state.cat !== 'all' ? '?cat=' + state.cat : ''}">查看全部 ${items.length} 条 →</a>` : ''}
    </section>`;
  }).join('');
  return cards ? `<div class="boards">${cards}</div>` : '<div class="empty">没有符合条件的热点</div>';
}

// ── 视图：大事聚合 ──
function filteredEvents() {
  return state.data.events.filter(e =>
    e.platforms.some(p => !state.hidden.has(p.source)) &&
    (state.cat === 'all' || e.category === state.cat) &&
    matchQ(e.title, e.summary, ...e.platforms.map(p => p.title)));
}

function renderEvents() {
  const S = srcMap();
  const list = filteredEvents();
  if (!list.length) return '<div class="empty">没有符合条件的事件</div>';
  const shown = list.slice(0, state.page * PAGE);
  return `<div class="list">${shown.map((e, i) => {
    const n = e.platforms.length;
    return `<article class="card post" data-kit-item="event/${e.id}">
      <div class="event-rank ${i < 3 ? 'top' : ''}">${String(i + 1).padStart(2, '0')}</div>
      <div class="post-body">
        <div class="post-meta">
          ${n > 1 ? `<span class="heat-badge">${n} 个平台在榜</span>` : ''}
          <span class="cat-tag" style="color:${catColor(e.category)}">${catName(e.category)}</span>
        </div>
        <h3><a ${kitAttr('event/' + e.id)}>${esc(e.title)}</a></h3>
        ${e.summary ? `<p class="summary">${esc(e.summary)}</p>` : ''}
        <div class="chips">${e.platforms.map(p => {
          const s = S[p.source], it = findItem(p.source, p.title);
          return it ? `<a class="chip" ${kitAttr(itemKey(s, it))} title="${esc(p.title)}">${avatar(s)}${esc(s.name)} <em>#${p.rank}</em></a>` : '';
        }).join('')}</div>
      </div>
      ${img(e.image, e.category)}
    </article>`;
  }).join('')}</div>${list.length > shown.length ? `<button class="load-more" id="more">加载更多（剩余 ${list.length - shown.length} 条）</button>` : ''}`;
}

// ── 视图：信息流（所有平台条目按相对排名交错） ──
function renderFeed() {
  const all = [];
  state.data.sources.forEach(s => {
    const n = Math.max(s.items.length, 1);
    visibleItems(s).forEach(it => all.push({ s, it, w: (it.rank - 1) / n }));
  });
  all.sort((a, b) => a.w - b.w || a.it.rank - b.it.rank);
  if (!all.length) return '<div class="empty">没有符合条件的热点</div>';
  const shown = all.slice(0, state.page * PAGE);
  return `<div class="list">${shown.map(({ s, it }) => `
    <article class="card post" data-kit-item="${itemKey(s, it)}">
      ${avatar(s, 'lg')}
      <div class="post-body">
        <div class="post-meta">
          <b>${esc(s.name)}</b><span>#${it.rank}</span>
          ${it.hot_text ? `<span>· ${esc(it.hot_text)}</span>` : ''}
          <span class="cat-tag" style="color:${catColor(it.category)}">${catName(it.category)}</span>${labelHtml(it.label)}
        </div>
        <h3><a ${kitAttr(itemKey(s, it))}>${esc(it.title)}</a></h3>
        ${it.summary && it.summary !== it.title ? `<p class="summary">${esc(it.summary)}</p>` : ''}
      </div>
      ${img(it.image, it.category)}
    </article>`).join('')}</div>${all.length > shown.length ? `<button class="load-more" id="more">加载更多（剩余 ${all.length - shown.length} 条）</button>` : ''}`;
}

// ── 右侧挂件 ──
function renderWidgets() {
  const { sources, events, categories } = state.data;
  const multi = events.filter(e => e.platforms.length > 1).slice(0, 10);
  $('#w-events').innerHTML = multi.map((e, i) => `
    <div class="w-row"><span class="rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</span>
      <a ${kitAttr('event/' + e.id)}>${esc(e.title)}</a>
      <small>${e.platforms.length} 平台</small></div>`).join('') || '<div class="w-row"><small>暂无</small></div>';

  const counts = {}; let total = 0;
  sources.forEach(s => s.items.forEach(it => { counts[it.category] = (counts[it.category] || 0) + 1; total++; }));
  const max = Math.max(...Object.values(counts), 1);
  $('#w-total').textContent = `${total} 条`;
  $('#w-cats').innerHTML = categories.map(c => `
    <div class="bar-row"><span>${c.name}</span><div class="bar"><i style="width:${(counts[c.id] || 0) / max * 100}%;background:${catColor(c.id)}"></i></div><span>${counts[c.id] || 0}</span></div>`).join('');

  const okN = sources.filter(s => s.ok).length;
  $('#w-ok').textContent = `${okN}/${sources.length} 正常`;
  $('#w-status').innerHTML = sources.map(s => `
    <div class="status-row" title="${esc(s.error)}">${avatar(s)}${esc(s.name)}
      <span class="t">${s.ok ? `<span class="ok">●</span> ${s.items.length} 条` : `<span class="${s.stale ? 'warn' : 'bad'}">●</span> ${s.stale ? '旧数据' : '失败'}`}</span></div>`).join('');
}

// ── 详情（右侧抽屉） ──
const tag = t => t ? `<span>${esc(t)}</span>` : '';
const catTag = c => `<span style="color:${catColor(c)}">${catName(c)}</span>`;
const hotKey = it => it.hot ? '热度' : '时间';
// 各平台排名行：能找到条目的点开站内详情，找不到的直接外链
const platRow = (x, cur) => {
  const t = x.it ? x.it.title : x.p.title, r = x.it ? x.it.rank : x.p.rank;
  const inner = `${avatar(x.s)}<span class="kit-rt">${cur ? '<b>' : ''}${esc(x.s.name)} · ${esc(t)}${cur ? '（当前）</b>' : ''}</span><span class="kit-rm">#${r}${x.it?.hot_text ? ' · ' + esc(x.it.hot_text) : ''}</span>`;
  if (cur) return `<div class="kit-row">${inner}</div>`;
  return x.it ? `<div class="kit-row" data-kit-go="${itemKey(x.s, x.it)}">${inner}</div>`
    : `<a class="kit-row" href="${esc(x.p.url)}" target="_blank" rel="noopener">${inner}</a>`;
};
const linkRows = list => list.length ? `<div class="kit-rows">${list.map(x => `<a class="kit-row" href="${esc(x.url)}" target="_blank" rel="noopener">${avatar(x.s)}<span class="kit-rt">${esc(x.s.name)} · ${esc(x.title)}</span><span class="kit-rm">↗</span></a>`).join('')}</div>` : '';
// 平台按钮：最多 3 个进底部按钮，其余放正文的「更多来源」
function platActs(links) {
  return { acts: links.slice(0, 3).map((x, i) => ({ text: `去${esc(short(x.s))} ↗`, href: x.url, pri: i === 0 })),
    rest: KIT.sec('更多来源', linkRows(links.slice(3)), '外部链接') };
}
const hotRows = list => `<div class="kit-rows">${list.map(({ s, it }) => `<div class="kit-row" data-kit-go="${itemKey(s, it)}">${avatar(s)}<span class="kit-rt">${esc(it.title)}</span><span class="kit-rm">${esc(short(s))} #${it.rank}</span></div>`).join('')}</div>`;

KIT.item('hot', id => {
  if (!state.data) return null;
  const hit = IDX.item.get(id); if (!hit) return null;
  const { s, it } = hit;
  const { e, list } = samePlatforms(s, it);
  const others = list.filter(x => x.s !== s);
  const near = s.items.filter(x => x !== it && Math.abs(x.rank - it.rank) <= 3).map(x => ({ s, it: x }));
  const sameCat = [];
  state.data.sources.forEach(o => o !== s && o.items.filter(x => x.category === it.category && x.rank <= 5 && !others.some(y => y.it === x)).slice(0, 1).forEach(x => sameCat.push({ s: o, it: x })));
  const links = [{ s, url: it.url, title: it.title }, ...others.map(x => ({ s: x.s, url: x.it ? x.it.url : x.p.url, title: x.it ? x.it.title : x.p.title }))].filter(x => x.url);
  const { acts, rest } = platActs(links);
  return { title: it.title, sub: `${avatar(s)} ${esc(s.name)} · 第 ${it.rank} 名 · ${timeAgo(s.updated)}更新`,
    cover: it.image || undefined, thumbIcon: CAT_ICON[it.category] || '📰', thumbBg: catBg(it.category),
    tags: [catTag(it.category), it.label ? tag(it.label) : '', list.length > 1 ? `<span style="background:var(--grad);color:#fff">${list.length} 个平台在榜</span>` : ''],
    big: `<b>#${it.rank}</b><span style="color:var(--text-3)">${esc(s.name)}</span>${it.hot_text ? `<b style="font-size:20px">${esc(it.hot_text)}</b><span style="color:var(--text-3)">${hotKey(it)}</span>` : ''}`,
    body: (it.summary && it.summary !== it.title ? KIT.sec('摘要', KIT.p(it.summary)) : '')
      + KIT.sec('概况', KIT.kv([['平台', s.name], ['排名', `第 ${it.rank} 名 / ${s.items.length}`], [hotKey(it), it.hot_text], ['分类', catName(it.category)], ['标签', it.label], ['在榜平台', list.length > 1 ? `${list.length} 个` : '']]))
      + (others.length ? KIT.sec('同一事件在各平台', `<div class="kit-rows">${list.map(x => platRow(x, x.s === s)).join('')}</div>`,
          e ? `<a class="kit-morelink" href="#/item/event/${e.id}" data-kit-go="event/${e.id}">事件详情 →</a>` : '按标题匹配') : '')
      + rest
      + KIT.sec(`${esc(s.name)}前后排名`, hotRows(near), `<a class="kit-morelink" href="#/list/${s.id}">全部 ${s.items.length} 条 →</a>`)
      + (sameCat.length ? KIT.sec(`其它平台的${catName(it.category)}热点`, hotRows(sameCat.slice(0, 6))) : ''),
    acts };
});

KIT.item('event', id => {
  if (!state.data) return null;
  const e = IDX.event.get(id); if (!e) return null;
  const S = srcMap();
  const list = e.platforms.map(p => ({ s: S[p.source], it: findItem(p.source, p.title), p })).filter(x => x.s);
  const summary = e.summary || list.map(x => x.it?.summary).find(t => t && t !== e.title) || '';
  const top = list.reduce((m, x) => x.p.rank < m ? x.p.rank : m, 99);
  const hottest = list.filter(x => x.it?.hot).sort((a, b) => b.it.hot - a.it.hot)[0];
  const related = state.data.events.filter(o => o !== e && o.category === e.category).slice(0, 6);
  const { acts, rest } = platActs(list.map(x => ({ s: x.s, url: x.p.url, title: x.p.title })));
  return { title: e.title, sub: `${list.length} 个平台在榜 · 最高第 ${top} 名`,
    cover: e.image || undefined, thumbIcon: CAT_ICON[e.category] || '🔥', thumbBg: catBg(e.category),
    tags: [catTag(e.category), list.length > 1 ? `<span style="background:var(--grad);color:#fff">跨平台大事</span>` : ''],
    big: `<b>${list.length}</b><span style="color:var(--text-3)">个平台在榜</span><b style="font-size:20px">#${top}</b><span style="color:var(--text-3)">最高排名</span>`,
    body: (summary ? KIT.sec('摘要', KIT.p(summary)) : '')
      + KIT.sec('概况', KIT.kv([['分类', catName(e.category)], ['在榜平台', `${list.length} 个`], ['最高排名', `第 ${top} 名`],
          ['最高热度', hottest ? `${hottest.it.hot_text}（${short(hottest.s)}）` : ''], ['热度分', e.score != null ? e.score.toFixed(2) : '']]))
      + KIT.sec('各平台排名', `<div class="kit-rows">${list.map(x => platRow(x)).join('')}</div>`, '点开看各平台条目')
      + rest
      + (related.length ? KIT.sec(`同类事件 · ${catName(e.category)}`, `<div class="kit-rows">${related.map(o => `<div class="kit-row" data-kit-go="event/${o.id}"><span class="kit-rt">${esc(o.title)}</span><span class="kit-rm">${o.platforms.length} 平台</span></div>`).join('')}</div>`) : ''),
    acts };
});

// ── 列表页：#/list/<平台id>?cat=&sort= ──
const LPAGE = 30;
let listN = LPAGE;
function registerLists() {
  state.data.sources.forEach(s => KIT.list(s.id, (_, q, box) => {
    const cat = q.get('cat') || 'all', sort = q.get('sort') || 'rank';
    let all = s.items.filter(it => cat === 'all' || it.category === cat);
    if (sort === 'hot') all = [...all].sort((a, b) => (b.hot || 0) - (a.hot || 0));
    const qs = (c, so) => { const p = new URLSearchParams(); c !== 'all' && p.set('cat', c); so !== 'rank' && p.set('sort', so); const t = p.toString(); return `#/list/${s.id}${t ? '?' + t : ''}`; };
    const cats = [{ id: 'all', name: '全部' }, ...state.data.categories].map(c => ({ c, n: s.items.filter(it => c.id === 'all' || it.category === c.id).length })).filter(x => x.n);
    box.innerHTML = KIT.shell({ title: s.name, note: `${s.items.length} 条 · ${s.stale ? '本次抓取失败，显示旧数据' : timeAgo(s.updated) + '更新'}`,
      chips: cats.map(({ c, n }) => ({ text: c.name, count: n, on: c.id === cat, href: qs(c.id, sort) })),
      sort: s.items.some(it => it.hot) ? [['rank', '按榜单排名'], ['hot', '按热度']] : null, sortVal: sort,
      body: `<section class="card board"><ol class="board-list">${all.slice(0, listN).map(it => rowHtml(s, it, true)).join('') || '<li class="row"><span class="row-title" style="color:var(--text-3)">暂无</span></li>'}</ol></section>`,
      more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
    const sel = box.querySelector('[data-kit-sort]');
    if (sel) sel.onchange = () => { location.hash = qs(cat, sel.value); };
  }));
}

// ── 渲染入口 ──
function render() {
  const { sources, updated } = state.data;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  renderNav();
  $('#updated').textContent = `更新于 ${new Date(updated).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
  const isList = KIT.route($('#content'));             // #/list/… 列表页
  $('.main-head').style.display = isList ? 'none' : '';
  if (isList) return;
  const html = { boards: renderBoards, events: renderEvents, feed: renderFeed }[state.view]();
  $('#content').innerHTML = html;
  const shown = sources.filter(s => !state.hidden.has(s.id));
  const n = shown.reduce((a, s) => a + visibleItems(s).length, 0);
  const multi = state.data.events.filter(e => e.platforms.length > 1).length;
  $('#subtitle').textContent = `${n} 条热点 · ${shown.length} 个平台 · ${multi} 个跨平台事件`;
}

let booted = false;
async function load() {
  const btn = $('#reload');
  btn.classList.add('spin');
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    state.data = await res.json();
    buildIndex();
    registerLists();
    renderWidgets();
    render();
    if (!booted) { booted = true; KIT.boot(); }          // 直接打开 #/item/… 链接时显示详情
  } catch (e) {
    $('#content').innerHTML = `<div class="empty">数据加载失败：${esc(e.message)}<br><small>本地预览需通过 HTTP 服务打开（python3 -m http.server）</small></div>`;
  } finally {
    btn.classList.remove('spin');
  }
}

// 在列表页里点了左侧筛选 / 视图切换：回到首页再渲染
const backHome = () => { if (KIT.parse()?.kind === 'list') { location.hash = state.view; return true; } return false; };

// ── 事件绑定 ──
document.addEventListener('click', e => {
  if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); return; }
  const t = e.target.closest('[data-cat],[data-src],[data-view],[data-toggle],#more');
  if (!t) return;
  if (t.dataset.cat) { state.cat = t.dataset.cat; state.page = 1; }
  else if (t.dataset.src) {
    const id = t.dataset.src;
    state.hidden.has(id) ? state.hidden.delete(id) : state.hidden.add(id);
    store.set('hidden', [...state.hidden]); state.page = 1;
  }
  else if (t.dataset.toggle) {
    const ids = state.data.sources.filter(s => s.region === t.dataset.toggle).map(s => s.id);
    const allOn = ids.every(id => !state.hidden.has(id));
    ids.forEach(id => allOn ? state.hidden.add(id) : state.hidden.delete(id));
    store.set('hidden', [...state.hidden]); state.page = 1;
  }
  else if (t.dataset.view) { state.view = t.dataset.view; store.set('view', state.view); state.page = 1;
    if (!backHome()) history.replaceState(null, '', '#' + state.view); }
  else if (t.id === 'more') { state.page++; }
  if (backHome()) return;
  render();
});
window.addEventListener('hashchange', () => { if (KIT.parse()?.kind !== 'item') listN = LPAGE; }, true);

let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; if (!backHome()) render(); }, 150);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; render(); $('#q').blur(); }
});
if (!/Mac/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';
$('#reload').onclick = load;

KIT.init(() => state.data && render());
load();
setInterval(load, 10 * 60 * 1000);  // 每 10 分钟自动刷新
</script>
